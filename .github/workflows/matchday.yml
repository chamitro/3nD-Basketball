# 3nD Basketball: plays match day on time, keeps the free Supabase project awake, and raises the alarm if the
# league server stops answering.
#
# The league server plays a match the first time anyone asks it something after the hour. This job asks, so the
# match is played (and a league ends and the next one starts) even when no manager opens the game.
# It uses only the public key that is already in index.html.
#
# If the server does not confirm that it is up to date, the job fails, and GitHub emails the repository owner.
#
# GitHub switches a schedule off when a repository has had no commit for 60 days. The last step below switches
# this one on again every time it runs, which restarts that count, so it should keep going by itself.
# GitHub may also start scheduled jobs late, sometimes by hours, which is why there are several slots after the
# match hour. A late job changes nothing in the result: the match is played with the plans as they stood.
name: match day and keep-alive
on:
  schedule:
    - cron: '4 18 * * 0,3'    # just after the match hour (18:00 UTC), Sunday and Wednesday
    - cron: '37 18 * * 0,3'   # again, in case the first run was late or failed
    - cron: '30 19 * * 0,3'
    - cron: '0 21 * * 0,3'
    - cron: '41 5 * * *'      # once a day, so the project never pauses for inactivity
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask the league server to play any match that is due
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            out=$(curl -s -m 90 -X POST "https://qslofkasphxcmfzgsdry.supabase.co/functions/v1/b3" \
              -H "Content-Type: application/json" \
              -H "apikey: sb_publishable_w6gn-2QkaS6eDAcsryYh-A_xJIFDMBo" \
              -H "Authorization: Bearer sb_publishable_w6gn-2QkaS6eDAcsryYh-A_xJIFDMBo" \
              -d '{"a":"ping"}' || true)
            echo "try $i: $out"
            case "$out" in *'"up_to_date":true'*) echo "The league is up to date."; exit 0;; esac
            sleep 15
          done
          echo "::error::The league server did not confirm that it is up to date. Open the game; if it says the league cannot be reached, check the Supabase project."
          exit 1
      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -w "enable: HTTP %{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/matchday.yml/enable" || true
