<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3nD Basketball</title>
<meta name="description" content="3nD Basketball: a cartoon basketball manager. Pick seven players, learn how to talk to each of them, set the tactics. Matches on fixed evenings, two or three a week, and you do not need to be online when they are played.">
<meta property="og:type" content="website">
<meta property="og:title" content="3nD Basketball">
<meta property="og:description" content="You are the coach. Talk to your players, set the tactics, matches on fixed evenings.">
<meta property="og:url" content="https://chamitro.github.io/3nD-Basketball/">
<meta property="og:image" content="https://chamitro.github.io/3nD-Basketball/icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff9f1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3nD Basketball">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--ink:#2b2233;--paper:#fff6e3;--card:#ffffff;--orange:#ff9f1c;--yellow:#ffd23f;--teal:#2ec4b6;--pink:#ff5d8f;--blue:#4d9de0;--green:#6bcb77;--red:#ef476f;--soft:#6b6477}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Baloo 2","Fredoka","Nunito","Ubuntu","Trebuchet MS",system-ui,sans-serif;font-weight:700;font-size:16px;background-image:radial-gradient(#f3e3bd 2px,transparent 2px);background-size:26px 26px}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 18px 50px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .logo{font-size:30px;font-weight:900;letter-spacing:-1px;transform:rotate(-2deg);background:var(--orange);border:4px solid var(--ink);border-radius:16px;padding:2px 16px;box-shadow:0 5px 0 var(--ink)}
  .chip{background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;box-shadow:0 4px 0 var(--ink);font-size:15px}
  .chip b{color:var(--red)}
  .tabs{margin-left:auto;display:flex;gap:8px}
  button{font-family:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s}
  button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  @media(hover:hover){button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  button.on{background:var(--yellow)}
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
  button.go{background:var(--pink);color:#fff;font-size:22px;padding:12px 26px;width:100%;margin-top:16px;text-shadow:0 2px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
  button.go:disabled{animation:none;background:#ddd;color:#888;text-shadow:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .rule{background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:22px;padding:10px 22px;box-shadow:0 6px 0 var(--ink);display:flex;align-items:center;gap:16px;margin-bottom:14px}
  .rule small{background:var(--ink);color:var(--yellow);border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
  .rule .txt{font-size:28px;font-weight:900;text-shadow:0 3px 0 var(--ink);line-height:1.1}
  .rule .why{font-size:14px;font-weight:700;opacity:.95}
  .scene{position:relative;border:4px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 7px 0 var(--ink);background:#bfe9ff}
  canvas#gym{display:block;width:100%;height:auto;cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .card{background:var(--card);border:4px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 var(--ink)}
  .card h3{margin:0 0 8px;font-size:20px;font-weight:900}
  .hint{font-weight:600;color:var(--soft);font-size:15px}
  .orders{margin-top:14px;border-top:3px dashed #e6dfd2;padding-top:10px}
  .trash{margin-top:14px;border-top:3px dashed #e6dfd2;padding-top:10px}
  .trash select{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink);max-width:100%;margin:6px 6px 6px 0}
  .trash button{font:inherit;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:7px 12px;background:#ffd43b;cursor:pointer}
  .banned{background:#ffc9c9;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:700}
  .orders .orow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
  .orders .olab{font-weight:800;min-width:150px}
  .orders select{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink);max-width:100%}
  .orders .owhy{flex-basis:100%;font-size:13px;color:var(--soft);margin:-2px 0 0}
  .pips{display:flex;gap:16px;margin:8px 0 10px;font-size:14px;flex-wrap:wrap}
  .pip{display:flex;align-items:center;gap:5px}
  .pip i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:inline-block}
  .pip i.f{background:var(--orange)}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btns.tone{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tone button{min-width:0;padding:9px 4px;font-size:15px}
  @media(hover:hover){.tone button:hover{background:#fff1a8}}
  .tone.team button{padding:6px 4px;font-size:14px}
  .tone .warm:hover{background:#ffd6e0}.tone .firm:hover{background:#cfe8ff}.tone .harsh:hover{background:#ffc9c9}.tone .joking:hover{background:#fff1a8}.tone .honest:hover{background:#d3f5d6}
  .plan{margin-top:16px}
  .dials{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .dial .lab{font-size:14px;color:var(--soft);margin-bottom:6px}
  .seg{display:flex}
  .seg button{flex:1;border-radius:0;margin-left:-3px;padding:8px 4px;font-size:15px}
  .seg button:first-child{border-radius:14px 0 0 14px;margin-left:0}.seg button:last-child{border-radius:0 14px 14px 0}
  .dial .d{font-size:12px;font-weight:600;color:var(--soft);margin-top:6px;min-height:30px;line-height:1.25}
  .dials+.dials{margin-top:10px}
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:700;padding:3px 0}
  .chk i{font-style:normal;flex:0 0 22px;height:22px;border:3px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#eee}
  .chk.g i{background:var(--green)}.chk.b i{background:#ffb3b3}
  .clip{margin-top:12px;border-top:3px dashed #e8dcc0;padding-top:10px}
  .small{font-size:13px;font-weight:600;color:var(--soft);margin-top:8px}
  .pop{animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .vote{cursor:pointer;text-align:center;font-size:19px;font-weight:900;padding:18px 12px;transition:transform .12s}
  @media(hover:hover){.vote:hover{transform:translateY(-4px) rotate(-1deg)}}
  .vote.on{background:var(--yellow)}
  .vote small{display:block;font-size:13px;color:var(--soft);margin-top:6px;font-weight:700}
  .res{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:3px dashed #e8dcc0}
  .res:last-child{border-bottom:none}
  .res .sc{font-size:28px;font-weight:900;min-width:124px;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:2px 10px;background:#eee}
  .res .sc.w{background:var(--green)} .res .sc.l{background:#ffb3b3}
  .res .why{font-weight:600;font-size:14px;color:#4b4458}
  .stamp{display:inline-block;font-size:13px;border:3px solid var(--ink);border-radius:8px;padding:0 8px;margin-left:8px;transform:rotate(-4deg)}
  .stamp.w{background:var(--green)}.stamp.l{background:#ffb3b3}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td,th{padding:5px 8px;border-bottom:3px dashed #e8dcc0;text-align:left}
  th{font-size:12px;color:var(--soft)}
  td.n,th.n{text-align:right}
  tr.me td{background:var(--yellow)}
  .pool{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
  .cand{background:var(--card);border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);text-align:center;padding:6px 6px 10px;cursor:pointer;transition:transform .12s}
  @media(hover:hover){.cand:hover{transform:translateY(-4px)}}
  .cand.in{background:var(--yellow)} .cand.out{background:#ffc9c9}
  .cand canvas{width:100%;height:auto;display:block}
  .cand .nm{font-size:17px;font-weight:900}
  .cand .h{font-size:12px;font-weight:600;color:var(--soft);min-height:32px;margin-top:3px}
  .chr{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;color:var(--ink);font-style:normal}
  .mark{font-size:13px;margin-left:4px}
  .cand .pips{justify-content:center;gap:4px;margin:4px 0 0;font-size:10px;flex-direction:column;align-items:center}
  .cand .pip i{width:9px;height:9px;border-width:2px}
  input[type=text]{font-family:inherit;font-weight:800;font-size:18px;border:3px solid var(--ink);border-radius:12px;padding:6px 12px;width:280px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;font-size:15px;z-index:9;animation:pop .25s}
  .foot{font-size:12px;font-weight:600;color:#b7a98a;text-align:center;margin-top:18px}
  .modal{position:fixed;inset:0;background:rgba(43,34,51,.6);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:26px 14px;overflow:auto}
  .sheet{max-width:860px;width:100%;font-weight:600;font-size:15px;line-height:1.45;position:relative}
  .sheet h2{margin:0 0 4px;font-size:30px;font-weight:900}
  .sheet h4{margin:18px 0 6px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:10px}
  .sheet h4 i{font-style:normal;flex:0 0 32px;height:32px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 0 var(--ink)}
  .sheet p,.sheet li,.sheet .hrow,.sheet .dl div{font-weight:500}
  .sheet b{font-weight:800}
  .sheet p{margin:6px 0}
  .sheet ul{margin:6px 0;padding-left:22px}
  .sheet li{margin:3px 0}
  .sheet .hrow{display:flex;gap:10px;align-items:baseline;margin:4px 0}
  .sheet .hrow .chr{flex:0 0 122px;text-align:center}
  .sheet .dl{margin:6px 0 8px}.sheet .dl>b{font-size:16px}.sheet .dl div{display:flex;gap:8px;margin:2px 0;font-size:14px}.sheet .dl span{flex:0 0 78px;font-weight:800;color:var(--red)}
  .sheet .two{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .sheet .note{background:#fff1a8;border:3px solid var(--ink);border-radius:14px;padding:8px 14px;margin-top:16px;font-size:14px}
  .sheet .x{position:absolute;right:14px;top:12px;padding:4px 14px}
  @media(max-width:700px){.sheet .two{grid-template-columns:1fr}}
  .btnlink{display:inline-block;font-weight:800;font-size:16px;color:var(--ink);background:var(--teal);border:3px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:0 5px 0 var(--ink);text-decoration:none}
  .update{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;background:var(--yellow);border:4px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:16px;animation:pop .25s}
  .update button{background:var(--pink);color:#fff;text-shadow:0 2px 0 var(--ink)}
  .sm{display:none}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .mode{cursor:pointer;text-align:center;padding:26px 18px;transition:transform .12s}
  @media(hover:hover){.mode:hover{transform:translateY(-5px) rotate(-1deg)}}
  .mode h3{font-size:28px;margin:0 0 6px}
  .mode p{font-weight:600;color:var(--soft);margin:6px 0 0}
  @media(max-width:700px){.modes{grid-template-columns:1fr}}
  .rd{border-top:3px dashed #e8dcc0;padding:8px 0}
  .rd summary{cursor:pointer;font-size:17px;font-weight:800;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rd summary::-webkit-details-marker{display:none}
  .rd summary::before{content:'▸';font-size:14px}.rd[open] summary::before{content:'▾'}
  .rd .scb{border:3px solid var(--ink);border-radius:10px;padding:0 8px;background:#eee;white-space:nowrap}
  .rdg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;margin-top:8px}
  .rdt{min-width:0}.rdt .chk{font-size:13px;padding:2px 0}.rdt .chk i{flex:0 0 18px;height:18px;border-width:2px;font-size:12px}
  .tagx{font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:999px;padding:0 7px;background:#fff1a8;white-space:nowrap}
  .rdnav{display:flex;gap:8px;justify-content:space-between;margin:6px 0 2px}.rdnav button{font-size:13px;padding:5px 12px}
  @media(max-width:700px){.rdg{grid-template-columns:1fr;gap:10px}}
  /* phones */
  @media(max-width:700px){
    body{font-size:15px}
    .wrap{padding:10px max(10px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
    header{gap:8px;margin-bottom:10px}
    .logo{font-size:22px;padding:1px 12px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
    .chip{font-size:13px;padding:3px 10px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
    .tabs{margin-left:0;width:100%;gap:6px}
    .tabs>span{flex:2}.tabs>span button{flex:1}.tabs>button{flex:1}
    .tabs button{padding:8px 4px;font-size:14px;white-space:nowrap}
    .lg{display:none}.sm{display:inline}
    button{font-size:15px;padding:9px 12px}
    .rule{flex-direction:column;align-items:flex-start;gap:6px;padding:9px 14px;border-radius:18px;margin-bottom:10px}
    .rule .txt{font-size:20px;text-shadow:0 2px 0 var(--ink)}
    .rule .why{font-size:13px}
    .scene{border-radius:20px}
    .row{grid-template-columns:1fr;gap:12px;margin-top:12px}
    .card{padding:12px 12px;border-radius:18px;border-width:3px;box-shadow:0 5px 0 var(--ink)}
    .card h3{font-size:18px}
    .dials{grid-template-columns:1fr;gap:10px}
    .dial .d{min-height:0}
    .seg button{padding:11px 2px;font-size:15px}
    .btns.tone{gap:7px}
    .tone button{padding:12px 2px;font-size:14px}
    .tone.team button{padding:10px 2px;font-size:13px}
    .grid3{grid-template-columns:1fr;gap:10px}
    .vote{padding:12px 10px;font-size:17px}
    .pool{grid-template-columns:repeat(3,1fr);gap:7px}
    .cand{padding:3px 3px 8px;border-width:3px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
    .cand .nm{font-size:15px}
    .cand .h{font-size:11px;min-height:0}
    .chr{font-size:11px;padding:0 6px}
    .res{gap:10px}
    .res .sc{font-size:24px;min-width:96px}
    table{font-size:14px}
    td,th{padding:5px 4px}
    button.go{font-size:19px;padding:13px 14px}
    input[type=text]{width:100%;font-size:16px}
    .modal{padding:8px 6px}
    .sheet h2{font-size:23px;padding-right:90px}
    .sheet h4{font-size:17px}
    .sheet .hrow .chr{flex:0 0 104px}
    .mode{padding:18px 12px}
    .mode h3{font-size:23px}
    .toast{left:10px;right:10px;transform:none;text-align:center;bottom:calc(16px + env(safe-area-inset-bottom))}
  }
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">3nD Basketball</div>
    <div class="chip" id="chipTeam"></div>
    <div class="chip" id="chipCup"></div>
    <div class="tabs"><button id="bHome" class="hide">‹ Menu</button><span id="tabs" style="display:flex;gap:8px"><button id="tRoom" class="on">Locker room</button><button id="tLeague">Table</button></span><button id="bHelp" style="background:var(--teal)">? <span class="lg">How to play</span><span class="sm">Help</span></button></div>
  </header>

  <div id="home" class="hide"></div>
  <div id="draft" class="hide"></div>

  <div id="room" class="hide">
    <div class="rule"><small id="ruleLab">RULE OF THE WEEK</small><div><div class="txt" id="ruleTxt"></div><div class="why" id="ruleWhy"></div></div></div>
    <div class="scene"><canvas id="gym" width="1160" height="400"></canvas></div>
    <div class="small hide" id="gymHint" style="text-align:center;margin-top:6px">Tap a player to talk to them or change their role.</div>
    <div id="weekUI">
      <div class="row">
        <div class="card" id="pcard"></div>
        <div class="card">
          <h3 id="talkh"></h3>
          <div class="btns tone" id="tones"></div>
          <div id="talkres" style="font-size:15px;margin-top:8px;min-height:20px"></div>
          <div class="small" id="sayhint" style="margin-top:2px">One talk per player each week. The same words land differently on each of them.</div>
          <div style="margin-top:12px;border-top:3px dashed #e8dcc0;padding-top:10px">
            <div style="font-size:15px;margin-bottom:6px" id="teamh">Talk to the whole team</div>
            <div class="btns tone team" id="teamtones"></div>
            <div id="trashUI"></div>
          </div>
        </div>
      </div>
      <div class="card plan">
        <h3 id="planH">Game plan for Sunday</h3>
        <div class="dials">
          <div class="dial"><div class="lab">Tempo</div><div class="seg" data-k="tempo"><button>slow</button><button>steady</button><button>fast</button></div><div class="d" data-d="tempo"></div></div>
          <div class="dial"><div class="lab">Shots</div><div class="seg" data-k="shots"><button>inside</button><button>mixed</button><button>outside</button></div><div class="d" data-d="shots"></div></div>
          <div class="dial"><div class="lab">Attack</div><div class="seg" data-k="off"><button>share</button><button>star ball</button><button>set plays</button></div><div class="d" data-d="off"></div></div>
        </div>
        <div class="dials">
          <div class="dial"><div class="lab">Defence</div><div class="seg" data-k="def"><button>man</button><button>zone</button><button>press</button></div><div class="d" data-d="def"></div></div>
          <div class="dial"><div class="lab">Their star</div><div class="seg" data-k="guard"><button>as normal</button><button>shadow</button><button>double</button></div><div class="d" data-d="guard"></div></div>
          <div class="dial"><div class="lab">Rebounds</div><div class="seg" data-k="boards"><button>get back</button><button>balanced</button><button>crash</button></div><div class="d" data-d="boards"></div></div>
        </div>
        <div class="orders" id="orders"></div>
        <div class="small" id="oppNote" style="font-size:15px;color:var(--ink);margin-top:12px"></div>
        <div class="clip" id="check"></div>
        <div class="small" id="subNote" style="font-size:15px;color:var(--ink)"></div>
      </div>
      <button class="go" id="play"></button>
      <div class="card hide" id="nextInfo" style="margin-top:16px;text-align:center;background:#d3f5d6"></div>
      <div class="small" style="text-align:center" id="playNote"></div>
    </div>
    <div id="resUI" class="hide"></div>
  </div>

  <div id="league" class="hide"></div>
  <div id="help" class="modal hide"><div class="card sheet" id="helpBody"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script src="engine.js"></script>
<script>
'use strict';
// ───────────────────────── basics ─────────────────────────
const INK='#2b2233';
const $=id=>document.getElementById(id);




// ───────────────────────── state ─────────────────────────
const S={phase:'draft',cup:1,sunday:1,rule:'three5',teams:[],me:null,pool:[],sel:null,results:null,vote:null,myVote:null,agents:[],swapOut:[],swapIn:[],tab:'room',teamTalked:false,lastSheets:null};
function save(){if(ONLINE){if(S.phase==='week')queuePlan();return;}try{localStorage.setItem('sundayleague2',JSON.stringify({S,NEXT_ID,names:[...usedNames]}));}catch(e){}}

    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).version;
    if(!v||v===APP_VERSION||APP_VERSION==='dev')return;
    updateShown=true;
    const d=document.createElement('div');d.className='update';
    d.innerHTML='<span>A newer version of 3nD Basketball is ready.</span><button id="bUpdate">Update now</button>';
    document.body.appendChild(d);
    $('bUpdate').onclick=async()=>{
      try{if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();}}catch(_e){}
      location.replace(location.pathname+'?v='+encodeURIComponent(v));
    };
  }catch(_e){}
}

function toon(c,p,x,y,s,t,o){

  else if(mood==='sad'){arm(-1,1.45,L);arm(1,1.45,L);}
  else if(yawn){arm(-1,1.2,L);arm(1,-1.2,L);}
  else{arm(-1,1.2+Math.sin(t*3+p.ph)*0.1,L);const h=arm(1,hasBall?0.5:1.2-Math.sin(t*3+p.ph)*0.1,L);
    if(hasBall){const bb=Math.abs(Math.sin(t*4+p.ph));const by=lerp(y-9*s,h[1]+10*s,bb);c.fillStyle='#ff8c2a';c.beginPath();c.arc(h[0]+4*s,by,9*s,0,Math.PI*2);c.fill();c.stroke();c.lineWidth=lw*0.5;c.beginPath();c.moveTo(h[0]-5*s,by);c.lineTo(h[0]+13*s,by);c.stroke();c.lineWidth=lw;}}

  else if(mood==='happy'){c.fillStyle='#7a2233';c.arc(bx,my-er*0.3,er*1.15,0,Math.PI);c.closePath();c.fill();c.stroke();if(p.temp==='joker'||p.teeth){c.fillStyle='#ff8fa3';c.beginPath();c.ellipse(bx+er*0.2,my+er*0.55,er*0.5,er*0.6,0,0,Math.PI*2);c.fill();c.stroke();}c.fillStyle='#ffb3c1';for(const d of [-1,1]){c.beginPath();c.arc(bx+d*hw*0.36,fy+er*1.1,er*0.5,0,Math.PI*2);c.fill();}}
  else if(mood==='angry'){c.fillStyle='#fff';c.rect(bx-er*1.1,my-er*0.5,er*2.2,er*0.9);c.fill();c.stroke();c.beginPath();for(let k=-1;k<=1;k++){c.moveTo(bx+k*er*0.55,my-er*0.5);c.lineTo(bx+k*er*0.55,my+er*0.4);}c.stroke();}
  else if(mood==='sad'){c.arc(bx,my+er*0.9,er*0.9,Math.PI*1.2,Math.PI*1.8);c.stroke();}

  else{c.arc(bx,my-er*0.5,er*0.9,Math.PI*0.15,Math.PI*0.85);c.stroke();if(p.teeth){c.fillStyle='#fff';c.fillRect(bx-er*0.4,my+er*0.2,er*0.8,er*0.55);c.strokeRect(bx-er*0.4,my+er*0.2,er*0.8,er*0.55);c.beginPath();c.moveTo(bx,my+er*0.2);c.lineTo(bx,my+er*0.75);c.stroke();}}

function toppers(c,p,bx,top,W,s,t,lw){

    case 'bun':c.fillStyle=p.col;c.beginPath();c.arc(bx,top-7*s,10*s,0,Math.PI*2);c.fill();c.stroke();break;

const hasEnergy=p=>!ONLINE||p.en!==undefined;

const TRUSTW=['does not trust you','is wary of you','is unsure about you','trusts you','would run through a wall for you'];

function oppView(op){
  let top=(op.starters||[]).map(id=>byId(op,id)).filter(Boolean);
  if(top.length<3)top=[...op.players].sort((a,b)=>rating(b)-rating(a)).slice(0,3);
  const star=byId(op,op.ball)||[...top].sort((a,b)=>b.sh-a.sh)[0];
  const ls=S.lastSheets&&S.lastSheets.find(x=>x.name===op.name);
  return {top,star,last:ls?ls.sheet:null};
}
// the assistant: what this plan means for these players, in this mood, against this opponent
function planCheck(){
  const me=S.me,sh=me.sheet,L=[];
  const st=me.starters.map(id=>byId(me,id)).filter(Boolean);
  if(st.length<3)return [[-1,'Pick three starters and I will tell you what I think of the plan. A team without a line-up plays its three weakest players.']];
  const op=nextOpp(),ov=op?oppView(op):null,ol=ov&&ov.last,oStar=ov&&ov.star;
  const star=byId(me,me.ball);
  const names=a=>{const n=a.map(p=>p.n);return n.length>2?n.slice(0,-1).join(', ')+' and '+n[n.length-1]:n.join(' and ');},are=a=>a.length>1?'are':'is';
  const is=m=>st.filter(p=>p.mood===m);
  const sad=is('sad'),nerv=is('nervous'),ang=is('angry'),cool=is('cool');
  const A=(a,f)=>a.reduce((x,p)=>x+f(p),0)/a.length;
  const mySp=A(st,p=>p.sp),myH=A(st,p=>p.h),mySh=A(st,p=>p.sh),myDf=A(st,p=>p.df);
  const oSp=ov?A(ov.top,p=>p.sp):2.5,oH=ov?A(ov.top,p=>p.h):0.5,oSh=ov?A(ov.top,p=>p.sh):2.5;
  const noRun=S.rule==='no_dribble'||S.rule==='tiny_court';
  const ro=p=>MOODFX[p.mood][2]+0.08*p.trust;
  // energy
  if(hasEnergy(st[0])){
    const worn=st.filter(p=>energyOf(p)<=1.5),tired=st.filter(p=>energyOf(p)>1.5&&energyOf(p)<=2.5);
    if(worn.length)L.push([-1,`${names(worn)} ${are(worn)} worn out and will play far below the dots. A match off gives energy back.`]);
    if(tired.length)L.push([-1,`${names(tired)} ${are(tired)} tired. Starting again will cost more energy.`]);
    if((worn.length||tired.length)&&(sh.tempo===2||sh.def===2))L.push([-1,`A ${sh.tempo===2&&sh.def===2?'fast tempo and a press both burn':sh.tempo===2?'fast tempo burns':'press burns'} extra energy.`]);
    const fresh=me.players.filter(p=>!me.starters.includes(p.id)&&energyOf(p)>=3.5&&!(S.rule==='tall_out'&&tallestId(me)===p.id));
    if((worn.length||tired.length)&&fresh.length)L.push([0,`Fresh on the bench: ${names(fresh.slice(0,3))}.`]);
  }
  // tempo
  if(sh.tempo===2){
    if(sad.length)L.push([-1,`${names(sad)} ${are(sad)} sulking and will drag in a fast game.`]);
    else if(nerv.length)L.push([-1,`A fast game rushes ${names(nerv)}, who ${are(nerv)} anxious, into fumbles.`]);
    else if(noRun)L.push([-1,'Nobody can run under this week\'s rule. A fast tempo only tires legs.']);
    else if(mySp>oSp+0.15)L.push([1,'You are quicker than them: a fast tempo gives you fast breaks.']);
    else if(mySp<=oSp)L.push([-1,'They are at least as quick as you: a fast tempo only tires your legs.']);
  }
  if(sh.tempo===0){
    if(nerv.length)L.push([1,`A slow game steadies the nerves of ${names(nerv)}.`]);
    else if(!noRun&&mySp>oSp+0.5)L.push([-1,'You are much quicker than them and a slow game wastes it.']);
    else if(!noRun&&oSp>mySp&&ol&&ol.tempo===2)L.push([1,'They are quicker and played fast last time: a slow game takes the running out of them.']);
  }
  // shots
  if(sh.shots===0){
    if(ol&&ol.def===1)L.push([-1,'They played a zone last time. A zone guards the hoop against close shots.']);
    else if(myH>oH+0.1)L.push([1,'You are taller than them: close shots will go in.']);
    else if(myH<oH-0.1)L.push([-1,'They are taller than you: close shots will be hard.']);
  }
  if(sh.shots===2){
    if(ol&&ol.def===1)L.push([1,'They played a zone last time: it leaves long shots open.']);
    else if(mySh>=3)L.push([1,'Your starters shoot well enough to live outside.']);
    else if(mySh<=2.2)L.push([-1,'Your starters are poor shooters. Long shots will mostly miss.']);
  }
  // attack
  if(sh.off===1){
    if(!star)L.push([-1,'Star ball with no star. Open a starter\'s card and press "Make the star".']);
    else{const m=star.mood;
      if(m==='nervous')L.push([-1,`${star.n} is anxious and will crumble with every ball coming to him.`]);
      else if(m==='sad')L.push([-1,`${star.n} is sulking. Do not build the attack on him today.`]);
      else if(m==='angry'&&star.temp!=='fighter')L.push([-1,`${star.n} is fuming and will force bad shots as the star.`]);
      else if(star.sh<2.5)L.push([-1,`${star.n} is not a good enough shooter to carry the attack.`]);
      else if(m==='happy'||m==='cool'||m==='angry')L.push([1,`${star.n} is ${WORD[m]}: the right day to run everything through him.`]);
      if(ol&&ol.guard===2)L.push([-1,'They double-teamed the star last time. Star ball walks into that.']);
      else if(ol&&ol.guard===1)L.push([-1,'They put a shadow on the star last time.']);
    }
  }
  if(sh.off===2){const r=A(st,ro),worst=[...st].sort((a,b)=>ro(a)-ro(b))[0];
    if(r>=1.03)L.push([1,'Your starters trust you: they will run the set plays properly.']);
    else if(r<0.95)L.push([-1,`${worst.n} ${worst.mood==='angry'?'is fuming and will ignore':worst.mood==='sad'?'is sulking and will forget':'does not trust you enough to follow'} the set plays.`]);
    else L.push([0,'Set plays live on trust. Your starters trust you only so-so, so expect little.']);
    if(sh.tempo===2)L.push([-1,'Set plays need time. A fast tempo breaks them.']);
    if(ol&&ol.def===2)L.push([-1,'They pressed last time. A press breaks the rhythm of set plays.']);
  }
  if(sh.off===0){const weak=[...sad,...nerv];
    if(weak.length)L.push([-1,`Sharing means ${names(weak)}, in no state to shoot, ${weak.length>1?'shoot':'shoots'} as often as anyone.`]);
    else if(ol&&ol.guard===2)L.push([1,'They double-teamed the star last time. Sharing gives them nobody to double.']);
  }
  // defence
  if(sh.def===2){
    if(sad.length)L.push([-1,`${names(sad)} ${are(sad)} sulking and will not chase in a press.`]);
    else if(ang.length)L.push([1,`${names(ang)} ${are(ang)} fuming: just right for hounding the ball in a press.`]);
    if(ol&&ol.off===2)L.push([1,'They ran set plays last time. A press breaks their rhythm.']);
    if(S.rule==='iron')L.push([-1,'No substitutions this week. A press burns your starters out.']);
    else if(!me.subs.length)L.push([-1,'A press with no substitutes: legs gone by the end.']);
  }
  if(sh.def===1){
    if(ang.length)L.push([-1,`${names(ang)} ${are(ang)} fuming and will wander out of the zone.`]);
    else if(cool.length)L.push([1,`${names(cool)} ${are(cool)} locked in and will hold the zone tight.`]);
    if(ol&&ol.shots===2)L.push([-1,'They shot from outside last time. A zone leaves exactly that open.']);
    else if(oSh>=3)L.push([-1,'They shoot well. A zone leaves long shots open.']);
    else if(oH>myH+0.1)L.push([1,'They are taller than you: a zone protects the hoop.']);
    else if(ol&&ol.shots===0)L.push([1,'They went inside last time: a zone protects the hoop.']);
    if(myDf<=2.2)L.push([1,'A zone hides your weak defenders.']);
    else if(myDf>=3.2)L.push([-1,'Your starters are fine defenders, and a zone wastes that.']);
  }
  if(sh.def===0){
    if(myDf>=3)L.push([1,'Your starters defend well: man to man lets each win his own duel.']);
    else if(myDf<=2.1)L.push([-1,'Your starters defend poorly, and man to man leaves each alone with his man.']);
  }
  // their star
  if(oStar){
    if(sh.guard===2){
      if(ol&&ol.off===1)L.push([1,`They ran everything through ${oStar.n} last time: two on him should hurt.`]);
      else if(ol&&ol.off===0)L.push([-1,'They shared the ball last time. A double team leaves someone open.']);
      else L.push([0,`Doubling ${oStar.n} pays only if they keep giving him the ball.`]);
    }
    if(sh.guard===1){const s=[...st].sort((a,b)=>b.df-a.df)[0];
      if(s.mood==='angry'&&s.temp!=='fighter')L.push([-1,`${s.n}, your best defender, is fuming and will be reckless shadowing ${oStar.n}.`]);
      else if(s.mood==='sad')L.push([-1,`${s.n}, your best defender, is sulking and will not stick to ${oStar.n}.`]);
      else if(s.df<2.5)L.push([-1,`${s.n} is your best defender and still not good enough to shadow ${oStar.n}.`]);
      else if(s.mood==='cool')L.push([1,`${s.n} is locked in and will stick to ${oStar.n} like glue.`]);
      else L.push([0,`${s.n} will shadow ${oStar.n}. It will tire him.`]);
    }
    if(sh.guard===0&&ol&&ol.off===1&&oStar.sh>=3)L.push([-1,`${oStar.n} got the ball all game last time, and you have nobody on him.`]);
  }
  // rebounds
  if(sh.boards===2){
    if(!noRun&&oSp>mySp)L.push([-1,'They are quicker: send everyone to the hoop and they run past you.']);
    else if(myH>oH+0.1)L.push([1,'You are taller: crashing the hoop wins second shots.']);
    else if(sad.length)L.push([-1,`${names(sad)} will not fight for rebounds while sulking.`]);
    else if(ang.length)L.push([1,`${names(ang)} will fight for every rebound.`]);
  }
  if(sh.boards===0){
    if(noRun)L.push([-1,'Nobody can run under this week\'s rule. Getting back guards against nothing.']);
    else if(oSp<=mySp)L.push([-1,'They are not quicker than you. Getting back guards against nothing and gives up second shots.']);
    else if(ol&&ol.tempo===2)L.push([1,'They are quicker and played fast last time: getting back stops their fast breaks.']);
    else L.push([0,'They are quicker, but only a fast tempo lets them use it. Getting back is a guess.']);
  }
  return L;
}

function renderHelp(){
  const chars=Object.keys(CHAR).map(k=>`<div class="hrow"><span class="chr" style="background:${CHAR[k][1]}">${CHAR[k][0]}</span><span>${CHAR[k][2]}</span></div>`).join('');

  <h2>How the game is played</h2>
  <p>You are the coach. You never touch the ball. You pick the team, talk to the players and choose the tactics, and the match plays by itself.</p>
  <h4><i>1</i>Pick your team</h4>
  <p>Choose <b>7 players</b> out of 14 and give your team a name. Look at their stats and at their character.</p>
  <ul><li><b>Stats</b>: Attack, Defence and Speed, each from 1 to 4 dots, and how tall the player is. A partly filled dot is a stat between two numbers: talks and matches move the stats in small steps, and every step stays until something moves it again. An arrow next to the dots marks a change made this week. Every player also has four <b>Energy</b> dots, and starts with all four.</li>

  <div class="two">${chars}</div>
  <h4><i>2</i>Talk to your players</h4>
  <p>Before every match you may talk <b>once to each player</b> and <b>once to the whole team</b>. There are nine ways to talk: ${TONES.map(t=>TONE_LABEL[t]).join(', ')}.</p>
  <ul><li>The same words do not work on everyone. Praise makes one player buzz and another anxious. Study each personality.</li>
  <li>Every player also has a secret <b>soft spot</b> (one talk that always works) and a <b>sore spot</b> (one that always backfires). You find them only by trying.</li>
  <li>The player's card remembers what you tried: ✓ worked, ✗ backfired, ~ nothing much.</li>
  <li>Saying the same thing two weeks in a row falls flat.</li>
  <li><b>Silence costs you.</b> A player you do not talk to for two matches in a row starts to feel ignored: they sulk or get angry, trust you less and play worse, and it gets worse every match. Old hands and fighters last a little longer, easy-going players longer still, and loners do not mind at all. A talk to the whole team counts for half.</li>
  <li>A talk changes the player's <b>mood</b>, how much they <b>trust</b> you, and moves one of their stats a little, up or down.</li>
  <li>A talk to the whole team reaches everybody, but more weakly. Some will like it and some will not.</li></ul>
  <h4><i>3</i>Moods, trust and form</h4>
  <p>The mood decides how a player performs and which tactics suit them today.</p>
  <ul>${moods}</ul>
  <p>Players who trust you follow the plan. Players who do not, ignore it and shoot whenever they like. Stats also move after each match: a player who shot well improves, one who never plays gets rusty, and a player you leave out completely may sulk or get angry.</p>
  <h4><i>4</i>Energy: rotate your squad</h4>
  <p>Every player has four <b>Energy</b> dots on their card. Four is fresh, one is worn out.</p>
  <ul><li><b>Playing costs energy.</b> A whole match costs about one dot. A fast tempo or a press costs more, a slow tempo less. A substitute who plays only part of the match pays less.</li>
  <li><b>A match off gives a dot and a half back.</b></li>
  <li><b>A tired player plays worse.</b> Shooting, defending, ball handling and running all drop below the dots.</li>
  <li><b>A worn-out player who is still made to play turns sour.</b> Most start sulking or fuming, and at one dot they stop trusting you. Loners and easy-going players tire just the same but do not turn sour.</li>
  <li><b>Resting a tired player does not upset them</b> and costs them no form. Leaving out a fresh player still does.</li>
  <li>A small battery appears beside the name of a tired player in the gym, and your assistant warns you before the match.</li></ul>
  <p>Play the same five every match and they are tired after three matches and worn out after four. You have seven players for a reason.</p>
  <h4><i>5</i>Set the game plan</h4>
  <p>Based on the state of your players and on your next opponent, decide how the team will play.</p>
  <ul><li><b>Three starters</b> and up to <b>two substitutes</b>. Substitutes come on when a starter tires. Look at Energy before you choose.</li>
  <li><b>One star</b>: the starter your attack looks for. The star gets the ball most and takes the last shots of a close game.</li>
  </ul><p>Then six dials:</p>
  <div class="two">${dial('Tempo','tempo',['slow','steady','fast'])}${dial('Shots','shots',['inside','mixed','outside'])}${dial('Attack','off',['share','star ball','set plays'])}${dial('Defence','def',['man','zone','press'])}${dial('Their star','guard',['as normal','shadow','double'])}${dial('Rebounds','boards',['get back','balanced','crash'])}</div>
  <p>Under the dials your <b>assistant</b> marks the plan with ✓ and ✗: what fits your players today and what the opponent did last time. After every match all game plans become public, yours too, so do not play the same match twice.</p>
  <h4><i>6</i>Half-time orders</h4>
  <p>The match is played without you, so you leave orders for half-time. There are three cases: <b>behind</b> means you are 5 points or more down at half-time, <b>ahead</b> means 5 or more up, and <b>close</b> is anything less than 5 points apart, for example 10-6 or 8-12. For each you choose one order, or nothing. At half-time your team reads the score and follows the order for that case for the rest of the match.</p>
  <ul><li><b>Press them</b> and <b>Drop into a zone</b> change the defence. <b>Slow the game down</b> and <b>Speed the game up</b> change the tempo, and the second half gets shorter or longer with it. <b>Shoot from outside</b> goes for three-pointers.</li>
  <li><b>Fresh legs</b>: both substitutes come on for the two most tired players on the court. <b>Everything through one player</b>: star ball for the second half, to a player you name; from the bench they come on. It pays for a player who is buzzing or locked in and sinks a cold, anxious or sulking one, like star ball in the plan.</li>
  <li>An order costs what it costs in the normal plan: a press and a fast game tire the legs, fresh legs are weaker legs, slowing down also shortens your own comeback. Players in a bad mood ignore an order the way they ignore the plan.</li>
  <li><b>The half-time talk.</b> Next to each order you can choose what you say to the whole team in the locker room, in one of your nine tones. Every player reacts to it the way they react to that tone in the week, moods only: no trust and no form change at half-time. A sharp talk (be honest, challenge, demand more) also lifts the whole second half a little, as real half-time speeches do; shouting lifts it less and makes hot-tempered and proud players fume; a soft talk works only through the players it reaches.</li>
  <li>Your result says when an order kicked in, what your talk did and what the second half brought. The match reports show everybody's half-time score, the talk and the order they used. Your assistant has no opinion on orders: this one is yours.</li>
  <li>No half-time under "First to eleven". No substitutions under "Iron legs", so fresh legs or a star from the bench cannot be followed that week.</li></ul>
  <h4><i>7</i>Trash talk</h4>
  <p>In the online league you may send one line from a menu to the other dugout before a match. It is the last word before tip-off: whatever you and the other manager said to your players during the week comes first, then your line lands on their players. Each of them takes it by character, moods only: worriers, people-pleasers, proud and hot-tempered players lose their heads, fighters, old hands and jokers get sharper. A line aimed at their star reaches the star for sure and the others less. A team that has heard you before is harder to rattle.</p>
  <ul><li><b>The price.</b> You are banned for the next match: no talks with your players, no half-time talk, no trash talk. The ban ends when that match is played. Everybody sees it in the match reports.</li>
  <li>You can take a line back any time before the match. Nobody sees it until the match is played.</li>
  <li>Real research on trash talk says it mostly fires the target up and only sometimes rattles them. Look at who you are talking to before you send it.</li></ul>
  <h4><i>8</i>The rule of the week</h4>
  <p>Every match is played under one funny rule, shown at the top of the locker room, for example "Attack counts double" or "The ceiling is very low". The rule changes which players and which tactics are worth most. After the match all managers vote for the next rule.</p>
  <h4><i>9</i>The match</h4>
  <p>You play against another manager ${ONLINE&&V&&V.league?'<b>'+matchWhen()+'</b>':'two or three evenings a week at <b>18:00 UTC</b>'}. You do not need to be online. The next time you open the game you see the score and the reasons for it. <b>Name your three starters before every match:</b> a team without a line-up plays its three weakest players.</p>
  <ul><li>A win gives <b>3 points</b>, a loss <b>0</b>.</li><li>There are no draws. A tied match goes on until somebody scores.</li><li><b>Notifications.</b> In the online league you can ask for a notification with your result after each match: the button is under the game plan, in the Next match box. It works on Android, and on iPhone once the game is added to the Home Screen.</li></ul>
  <h4><i>10</i>Match reports: scout the others</h4>
  <p>After every match day the <b>Table tab</b> shows the <b>match reports</b>: every score, and for each team the plan it played, <b>three strong points</b> (+) and <b>three weak points</b> (−) from that match. For example "Close to the hoop: made 8 of 10", "Lost the ball 7 times against the press", "Tired at the end".</p>
  <ul><li><b>Read your next opponent.</b> Their last report is also shown under your game plan, next to their name. A team that keeps losing the ball, shoots badly from long range or gets outrun tells you how to play them.</li>
  <li><b>Their league so far.</b> From an opponent's second match of the league on, you also see next to their name what they have done in the whole league: the plans they chose most often and their numbers per match (ball losses, fast breaks, second shots, how they shoot and how teams shoot against them).</li>
  <li><b>The reading is yours.</b> Your assistant does not judge these numbers for you. It knows your own players and what the opponent did last time; what an opponent's history means for your plan is your decision.</li>
  <li><b>Yours is public too.</b> Every manager can read your strong and weak points, so fix what they will aim at.</li>
  <li><b>Look back.</b> With "Earlier" and "Later" you can read the reports of older match days.</li></ul>
  <p>Match reports are part of the online league.</p>
  <h4><i>11</i>The league</h4>
  <p>There are <b>four leagues a year</b>, one for each season. Each lasts three months, about 26 matches. The team with the most points wins the league.</p>
  <ul><li><b>Winter League</b>: December, January, February.</li><li><b>Spring League</b>: March, April, May.</li><li><b>Summer League</b>: June, July, August.</li><li><b>Autumn League</b>: September, October, November.</li></ul>
  <p>Between two leagues:</p>
  <ul><li><b>Every new league starts with no teams.</b> When a league ends, open the game: you see how it ended, and you press <b>Enter the league</b> to put your team in the next one. A team whose manager does not press the button is not in it.</li>
  <li><b>Your team stays yours.</b> The same name, the same players and the same record go with you into every league. Nobody else can take your team name.</li>
  <li><b>One change.</b> Before you enter you may change <b>${SWAP_WORDS}</b> of your seven players for a free agent.</li>
  <li><b>Late is allowed.</b> You can enter a league that is already running. You start from zero points.</li>
  <li><b>The record.</b> The Table tab keeps every league your team finished ("1st once, 4th three times") and a list of <b>leagues won</b> by every team.</li></ul>
  <div class="note">${ONLINE?'<b>Online league:</b> the league being played now is '+LG()+', '+V.league.of+' matches.'+(V.league.no===1?' It is a one-month trial before the first Winter League.':'')+' If the number of managers is odd, one computer team fills the gap, and it leaves as soon as another manager joins. Your team lives in this browser: use "Play this team on another device" in the Table tab before you clear your browser data.':'<b>Practice mode:</b> the seven rival teams are run by the computer, you press "Play Sunday!" instead of waiting for match day, a league is seven matches, and the next league starts with the same eight teams as soon as you press the button.'}</div>
  <button class="go" id="helpOk" style="animation:none">Got it</button>`;
  $('helpX').onclick=$('helpOk').onclick=()=>$('help').classList.add('hide');
}

    if(ONLINE&&((m.pros||[]).length||(m.cons||[]).length))h+=`<div class="rdt" style="margin-top:6px"><div class="small" style="margin:0 0 2px">What every manager can read about your team in this match (the Table tab has the reports of all teams):</div>${repLines(m)}</div>`;}
  h+=`<div class="small">${r.moves.length?'Afterwards: '+r.moves.join(', ')+'.':'The mood in the locker room is unchanged.'} You are ${ord(r.place)} of ${r.of||8}.</div></div>`;
  if(!(ONLINE&&S.out)){h+=`<h3 style="margin:18px 4px 8px">${ONLINE?'Vote for '+DAY2()+"'s rule":"Vote for next Sunday's rule"}</h3>${ONLINE?'<div class="small" style="margin:-4px 4px 8px">'+DAY()+"'s rule is already set: <b>"+ruleOf(S.rule).txt+'</b> The votes cast now decide the rule of the match after it.</div>':''}<div class="grid3">`;
  S.vote.opts.forEach((k,i)=>{h+=`<div class="card vote ${S.myVote===i?'on':''}" data-v="${i}">${ruleOf(k).txt}<small>${ruleOf(k).why}</small></div>`;});
  h+=`</div>`;}
  h+=`<button class="go" id="next">${ONLINE?(S.out||(S.me.final&&!S.me.final.seen)?'The league is over. See how it ended':'Back to the locker room'):S.sunday>=7?'The league is over. See the final table':'On to next week'}</button>`;
  $('resUI').innerHTML=h;
  $('resUI').querySelectorAll('.vote').forEach(v=>v.onclick=()=>{if(ONLINE){S.myVote=+v.dataset.v;renderResults();api('vote',{i:S.myVote}).catch(e=>toast(e.message));return;}S.myVote=+v.dataset.v;const t=S.vote.tally.slice();t[S.myVote]++;S.vote.winner=S.vote.opts[t.indexOf(Math.max(...t))];save();renderResults();});
  $('next').onclick=()=>{if(ONLINE){localStorage.setItem('b3seen',String(resKey(V.me.last)));applyView(V);render();}else nextWeek();};
  // count the scores up
  const t0=performance.now();const els=[...$('resUI').querySelectorAll('.sc')];
  (function tick(now){const k=clamp((now-t0)/1100,0,1);for(const e of els){e.textContent=Math.round(e.dataset.us*k)+'–'+Math.round(e.dataset.them*k);}if(k<1)requestAnimationFrame(tick);})(t0);
}

function leagueSoFarHtml(sc){
  const most=a=>{const i=a.indexOf(Math.max(...a));return a[i]/sc.n>=0.5?i:-1;},W={t:['slow','steady','fast'],s:['inside','mixed','outside'],o:['share','star ball','set plays'],d:['man','zone','press'],g:['no special guard','shadow','double'],b:['get back','balanced','crash']};
  const plans=['t','s','o','d','g','b'].map(k=>{const i=most(sc[k]);return i<0?null:W[k][i]+' ('+sc[k][i]+')';}).filter(Boolean);
  const r1=x=>Math.round(x/sc.n*10)/10,pc=(m,a)=>a?Math.round(100*m/a)+'%':'none taken';
  return `<div class="rdt" style="margin-top:8px;font-weight:600"><b>Their league so far</b> (${sc.n} matches, ${sc.w} won). Most often: ${plans.length?plans.join(' · '):'something different every match'}.
    <div class="small" style="margin-top:2px;color:var(--ink)">Per match: loses the ball ${r1(sc.to)} times · ${r1(sc.fb)} fast breaks, outrun on ${r1(sc.ofb)} · second shots ${r1(sc.sec)} for, ${r1(sc.osec)} against. Close shots ${pc(sc.m2,sc.a2)}, long shots ${pc(sc.m3,sc.a3)}; teams against them: close ${pc(sc.om2,sc.oa2)}, long ${pc(sc.om3,sc.oa3)}.</div></div>`;
}

  wireInstall();

  if($('rdNext'))$('rdNext').onclick=()=>{if(RD&&RD.next)loadRound(RD.next);};
  if(ONLINE&&RD_KEY!==rdKey()&&!RD_BUSY)loadRound();   // first visit, or a new match day has been played since
}
function candHtml(p,cls,i){return `<div class="cand ${cls}" data-i="${i}"><canvas width="150" height="170" data-pid="${p.id}"></canvas><div class="nm">${p.n}</div>${chip(p)}<div class="h">${CHAR[p.temp][2]}</div><div class="pips">${pips(p.sh,'attack')}${pips(p.df,'defend')}${pips(p.sp,'speed')}</div></div>`;}
let drawList=[];

  $('start').onclick=()=>{const nm=($('tname').value||'').trim();if(ONLINE){S.draftName=nm;goOnline('join',{name:nm,picks:S.pool.filter(p=>p.picked).map(p=>p.id)});}else startLeague(nm);};
}
// Online, a league that ends leaves every team outside the next one. This screen shows how the last league ended

function renderEnter(){
  const f=S.me.final,fresh=!!(f&&!f.seen),lf=V.league.final,n=V.league.no,won=fresh&&f.place===1;
  const same=S.swapOut.length===S.swapIn.length,t=V.league.next_match_at;

      h+=`<table style="margin-top:12px;text-align:left"><tr><th>#</th><th>team</th><th class="n">W</th><th class="n">L</th><th class="n">Pts</th></tr>`;
      lf.table.forEach((x,i)=>{h+=`<tr class="${x.name===S.me.name?'me':''}"><td>${i+1}</td><td>${x.name}</td><td class="n">${x.w}</td><td class="n">${x.l}</td><td class="n"><b>${x.pts}</b></td></tr>`;});

  <div class="small" style="margin-top:6px;color:var(--ink)">${V.league.match_no===1?'The first match is on '+when+'.':'It is at match '+V.league.match_no+' of '+V.league.of+'. You would start from zero points. The next match is on '+when+'.'} Your players and your record stay with you.</div>${btn('newcup')}</div>`;

    <h3 style="margin-top:16px">Free agents</h3><div class="pool">${S.agents.map((p,i)=>candHtml(p,S.swapIn.includes(p.id)?'in':'',i)).join('')}</div></div>`+btn('newcup2');
